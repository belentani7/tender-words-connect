name: ABRAZO quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abrazo-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Types, lint, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exactly the committed dependencies
        run: npm ci --no-fund
      - name: Typecheck, lint, test and build
        run: npm run quality:check
      - name: Production dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high
      - name: Retain build for review
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: abrazo-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
