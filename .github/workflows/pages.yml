name: Build & Deploy Pages (Vite)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar exactamente las dependencias del lockfile
        run: npm ci --no-audit --no-fund
      - name: Build (base relativa para Pages subpath)
        run: npx vite build --base=./ --outDir=dist --emptyOutDir
        env:
          NODE_ENV: production
          # URL derivable del supabase/config.toml commiteado (project_id ejkcfwcjreaobffuexsb)
          VITE_SUPABASE_URL: https://ejkcfwcjreaobffuexsb.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: SPA fallback (404 -> index)
        run: |
          if [ -f dist/index.html ]; then cp dist/index.html dist/404.html; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
